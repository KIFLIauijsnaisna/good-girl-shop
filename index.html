<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Good Girl Csillagbolt</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ffe6ea 0%, #ffc3d0 100%);
            min-height: 100vh;
        }
        .font-pacifico {
            font-family: 'Pacifico', cursive;
        }
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); opacity: 1; }
            50% { transform: translateY(-12px) rotate(4deg); }
            100% { transform: translateY(0px) rotate(0deg); opacity: 1; }
        }
        .floating-heart {
            animation: float 4s ease-in-out infinite;
        }
        .card-hover {
            transition: all 0.3s ease;
        }
        .card-hover:hover {
            transform: translateY(-6px) scale(1.01);
            box-shadow: 0 12px 25px rgba(255, 105, 180, 0.25);
        }
    </style>
</head>
<body class="p-4 md:p-8 text-pink-900 flex flex-col min-h-screen">

    <div class="max-w-3xl mx-auto w-full flex-grow">
        <!-- Fejléc -->
        <header class="text-center my-6 relative">
            <span class="text-4xl floating-heart inline-block">💖</span>
            <h1 class="text-4xl md:text-5xl font-pacifico text-pink-600 drop-shadow-sm my-2">
                Good Girl Csillagbolt
            </h1>
            <p class="text-pink-500 font-medium italic text-sm md:text-base">Gyűjts csillagokat és váltsd be őket édes meglepetésekre! ✨</p>
        </header>

        <!-- Egyenleg Kártya és Jobb Fenti Előzmények Gomb -->
        <div class="relative mb-8">
            <!-- Előzmények Gomb Jobb Fent -->
            <div class="absolute -top-3 right-2 z-10">
                <button onclick="toggleHistory()" id="history-btn" class="bg-white/90 hover:bg-white text-pink-600 font-bold py-2 px-4 rounded-xl shadow-md border-2 border-pink-200 text-xs transition transform active:scale-95 flex items-center gap-1.5 cursor-pointer">
                    <span>📜</span> <span class="hidden sm:inline">Előzmények</span>
                </button>
            </div>

            <!-- Egyenleg Kártya -->
            <div class="bg-white/90 backdrop-blur-md rounded-3xl p-6 text-center shadow-xl border-4 border-pink-200 relative overflow-hidden">
                <div class="absolute -top-4 -right-4 text-6xl opacity-20 select-none">🌸</div>
                <div class="absolute -bottom-4 -left-4 text-6xl opacity-20 select-none">💖</div>
                
                <h2 class="text-sm md:text-base font-semibold text-pink-400 uppercase tracking-wider mb-1">Aktuális Egyenleged</h2>
                <div class="flex items-center justify-center gap-3 my-2">
                    <span class="text-5xl md:text-6xl font-extrabold text-pink-600 drop-shadow" id="star-count">0</span>
                    <span class="text-4xl md:text-5xl animate-bounce select-none">⭐</span>
                </div>
                <p class="text-xs md:text-sm text-pink-400 font-medium">Mindig ügyes vagy, büszke vagyok rád! 💕</p>
            </div>
        </div>

        <!-- Lenyíló Előzmények Doboz (Alapból rejtett) -->
        <div id="history-box" class="hidden bg-white/90 backdrop-blur-md rounded-3xl p-6 shadow-lg border-2 border-pink-200 mb-8 transition-all duration-300">
            <h3 class="text-lg font-pacifico text-pink-600 mb-4 text-center">Eddig Beváltott Jutalmak 📜</h3>
            <div id="history-list" class="space-y-3">
                <p class="text-xs text-pink-400 text-center italic">Még nem volt vásárlás.</p>
            </div>
        </div>

        <!-- Bolt Jutalmak Listája -->
        <h2 class="text-2xl font-pacifico text-pink-600 mb-6 text-center">Választható Jutalmak 🎁</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-8" id="shop-items">
            <!-- Ide tölti be a JS a kártyákat -->
        </div>
    </div>

    <!-- Rejtett Admin Felület (Láblécben) -->
    <footer class="mt-12 text-center border-t border-pink-200/60 pt-6 pb-4">
        <button onclick="toggleAdmin()" class="text-xs text-pink-400 hover:text-pink-600 underline transition font-medium">
            🔒 Csillag Adás (Szerelmednek)
        </button>
        
        <!-- Admin Panel -->
        <div id="admin-panel" class="hidden mt-4 p-5 bg-white/95 rounded-2xl shadow-lg border border-pink-300 max-w-sm mx-auto">
            <h3 class="font-bold text-pink-700 text-sm mb-3">⭐ Csillagok Jóváírása (Admin)</h3>
            <div class="flex justify-center gap-2">
                <input type="password" id="admin-pass" placeholder="Jelszó" class="p-2 rounded-lg text-sm border border-pink-300 focus:outline-none focus:ring-2 focus:ring-pink-400 w-28 text-center">
                <input type="number" id="add-amount" value="1" min="1" class="p-2 rounded-lg text-sm border border-pink-300 focus:outline-none focus:ring-2 focus:ring-pink-400 w-16 text-center font-bold text-pink-600">
                <button onclick="addStars()" class="bg-pink-500 hover:bg-pink-600 text-white font-bold px-4 py-2 rounded-lg text-sm transition shadow">
                    + Csillag
                </button>
            </div>
            <p id="admin-msg" class="text-xs mt-3 font-semibold"></p>
        </div>
    </footer>

    <script>
        // --- 1. SUPABASE BEÁLLÍTÁSOK ---
        const SUPABASE_URL = "https://hwllaxxhexuoyxzildqv.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh3bGxheHhoZXh1b3l4emlsZHF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwODc3MzUsImV4cCI6MjEwNzY2MzczNX0.Ek0TcWIbP2-J3SROEacpiktTGXAb7oOQn_d39sZTDB8";
        const ADMIN_PASSWORD = "1234";

        let supabaseClient = null;
        try {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch (e) {
            console.error("Supabase hiba:", e);
        }

        // --- 2. JUTALMAK LISTÁJA ---
        const items = [
            { id: 1, title: "10 Perc Hátmasszázs", price: 3, icon: "💆‍♀️", desc: "Egy pihentető masszázs a fárasztó nap után." },
            { id: 2, title: "Kedvenc Finomság / Süti", price: 5, icon: "🧁", desc: "Bármilyen édesség vagy nassolni való, amit megkívánsz." },
            { id: 3, title: "Moziest & Popcorn", price: 8, icon: "🍿", desc: "Te választod ki a filmet, én hozom a popcornt!" },
            { id: 4, title: "Királylány Nap (Nem mosogatsz)", price: 10, icon: "👑", desc: "Ezen a napon minden házimunkát én csinálok helyetted." },
            { id: 5, title: "Romantikus Vacsora Randi", price: 15, icon: "🍝", desc: "Elviszlek a kedvenc éttermedbe vagy főzök neked finomat." },
            { id: 6, title: "Kívánság Jolly Joker", price: 20, icon: "✨", desc: "Bármit kérhetsz tőlem, amit csak szeretnél!" }
        ];

        let currentStars = 0;

        // --- 3. BOLT KIRAKÁSA ---
        function renderShop() {
            const container = document.getElementById('shop-items');
            container.innerHTML = '';

            items.forEach(item => {
                container.innerHTML += `
                    <div class="bg-white/90 backdrop-blur-sm rounded-2xl p-5 shadow-md border-2 border-pink-100 card-hover flex flex-col justify-between">
                        <div>
                            <div class="text-4xl mb-2 text-center select-none">${item.icon}</div>
                            <h3 class="font-bold text-base text-pink-700 text-center">${item.title}</h3>
                            <p class="text-xs text-pink-400 text-center mt-1 mb-4 leading-relaxed">${item.desc}</p>
                        </div>
                        <div class="flex items-center justify-between mt-auto pt-3 border-t border-pink-100">
                            <span class="font-extrabold text-pink-500 text-sm">${item.price} ⭐</span>
                            <button onclick="buyItem(${item.price}, '${item.title}')" 
                                class="bg-gradient-to-r from-pink-400 to-rose-400 hover:from-pink-500 hover:to-rose-500 text-white font-bold py-2 px-4 rounded-xl text-xs shadow transition transform active:scale-95 cursor-pointer">
                                Megveszem 💕
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        // --- 4. ADATOK ÉS ELŐZMÉNYEK BETÖLTÉSE ---
        async function loadStars() {
            if (!supabaseClient) return;
            try {
                let { data, error } = await supabaseClient.from('user_stars').select('stars').eq('id', 1).single();
                if (data) {
                    currentStars = data.stars;
                    document.getElementById('star-count').innerText = currentStars;
                }
            } catch (err) {
                console.error("Adatbetöltési hiba:", err);
            }
        }

        async function loadHistory() {
            if (!supabaseClient) return;
            try {
                let { data, error } = await supabaseClient
                    .from('purchases')
                    .select('*')
                    .order('created_at', { ascending: false });

                const historyContainer = document.getElementById('history-list');
                if (data && data.length > 0) {
                    historyContainer.innerHTML = '';
                    data.forEach(purchase => {
                        const date = new Date(purchase.created_at).toLocaleString('hu-HU', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                        historyContainer.innerHTML += `
                            <div class="flex justify-between items-center bg-pink-50/80 p-3 rounded-xl border border-pink-100 text-xs">
                                <div>
                                    <span class="font-bold text-pink-700">${purchase.title}</span>
                                    <span class="text-pink-400 ml-2">(${date})</span>
                                </div>
                                <span class="font-extrabold text-pink-500">-${purchase.price} ⭐</span>
                            </div>
                        `;
                    });
                } else {
                    historyContainer.innerHTML = `<p class="text-xs text-pink-400 text-center italic">Még nem volt vásárlás.</p>`;
                }
            } catch (err) {
                console.error("Előzmény betöltési hiba:", err);
            }
        }

        // Előzmény doboz lenyitása / bezárása
        function toggleHistory() {
            const box = document.getElementById('history-box');
            box.classList.toggle('hidden');
            if (!box.classList.contains('hidden')) {
                loadHistory(); 
            }
        }

        // Valós idejű figyelés
        if (supabaseClient) {
            supabaseClient.channel('custom-all-channel')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'user_stars' }, (payload) => {
                    if (payload.new && payload.new.stars !== undefined) {
                        currentStars = payload.new.stars;
                        document.getElementById('star-count').innerText = currentStars;
                    }
                })
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'purchases' }, () => {
                    loadHistory();
                })
                .subscribe();
        }

        // --- 5. VÁSÁRLÁS LOGIKA ---
        async function buyItem(price, title) {
            if (!supabaseClient) {
                alert("Hiba: Nincs kapcsolat az adatbázissal!");
                return;
            }

            await loadStars();

            if (currentStars < price) {
                alert(`Jaj, még nincs elég csillagod ehhez! 😢\nSzükséges: ${price} ⭐ | Jelenlegi: ${currentStars} ⭐`);
                return;
            }

            if (confirm(`Biztosan meg szeretnéd venni ezt: "${title}" ${price} csillagért? 💕`)) {
                const newTotal = currentStars - price;
                
                const { error: updateError } = await supabaseClient
                    .from('user_stars')
                    .update({ stars: newTotal })
                    .eq('id', 1);

                const { error: historyError } = await supabaseClient
                    .from('purchases')
                    .insert([{ title: title, price: price }]);

                if (updateError || historyError) {
                    alert("Hiba történt a vásárlás során!");
                } else {
                    currentStars = newTotal;
                    document.getElementById('star-count').innerText = currentStars;
                    loadHistory();
                    alert(`Sikeres vásárlás! 🎉\nKiváltva: ${title}\nJó szórakozást! 🥰`);
                }
            }
        }

        // --- 6. ADMIN PANEL LOGIKA ---
        function toggleAdmin() {
            const panel = document.getElementById('admin-panel');
            panel.classList.toggle('hidden');
        }

        async function addStars() {
            if (!supabaseClient) return;
            const pass = document.getElementById('admin-pass').value;
            const amountInput = document.getElementById('add-amount').value;
            const amount = parseInt(amountInput);
            const msg = document.getElementById('admin-msg');

            if (pass !== ADMIN_PASSWORD) {
                msg.innerText = "Hibás jelszó! ❌";
                msg.className = "text-xs mt-3 text-red-500 font-semibold";
                return;
            }

            if (isNaN(amount) || amount <= 0) {
                msg.innerText = "Adj meg egy érvényes számot! ❌";
                msg.className = "text-xs mt-3 text-red-500 font-semibold";
                return;
            }

            await loadStars();
            const newTotal = currentStars + amount;
            
            const { error } = await supabaseClient
                .from('user_stars')
                .update({ stars: newTotal })
                .eq('id', 1);

            if (!error) {
                msg.innerText = `Sikeresen hozzáadva +${amount} csillag! ✨`;
                msg.className = "text-xs mt-3 text-green-600 font-semibold";
                document.getElementById('admin-pass').value = '';
                currentStars = newTotal;
                document.getElementById('star-count').innerText = currentStars;
            } else {
                msg.innerText = "Hiba történt: " + error.message;
                msg.className = "text-xs mt-3 text-red-500 font-semibold";
            }
        }

        // Indításkor betöltés
        renderShop();
        loadStars();
    </script>
</body>
</html>
